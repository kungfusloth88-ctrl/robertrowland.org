<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robert Rowland</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    color: #000;
    font-family: Georgia, serif;
}

body {
    overflow: hidden;
}

h1 {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 400;
    font-size: 42px;
    letter-spacing: .03em;
}

#enter {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    border: none;
    background: none;
    color: #000;
    font-family: inherit;
    font-size: 20px;
    cursor: pointer;
    padding: 12px;
}
</style>
</head>

<body>

<h1>robert rowland</h1>

<button id="enter">enter</button>

<script>
const button = document.getElementById("enter");

const isTouch =
    ("ontouchstart" in window) ||
    navigator.maxTouchPoints > 0;

let shift = false;

// Put the clue in the URL without requiring a new page.
if (window.location.pathname === "/" && !window.location.search.includes("hldshft2entr")) {
    history.replaceState(null, "", "/?hldshft2entr");
}

document.addEventListener("keydown", event => {
    if (event.key === "Shift") {
        shift = true;
    }
});

document.addEventListener("keyup", event => {
    if (event.key === "Shift") {
        shift = false;
    }
});

button.addEventListener("mouseenter", () => {
    if (isTouch) return;
    if (shift) return;

    const padding = 30;

    const maxX = window.innerWidth - button.offsetWidth - padding;
    const maxY = window.innerHeight - button.offsetHeight - padding;

    button.style.left = Math.random() * maxX + padding + "px";
    button.style.top = Math.random() * maxY + padding + "px";
    button.style.transform = "translate(0, 0)";
});

button.addEventListener("click", event => {
    if (!isTouch && !shift) {
        event.preventDefault();
        return;
    }

    window.location = "/archive/";
});
</script>

</body>
</html>
