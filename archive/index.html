<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archive | Robert Rowland</title>

<style>
html, body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    padding: 42px 28px 90px;
}

header {
    margin-bottom: 90px;
}

header a {
    color: #000;
    text-decoration: none;
    font-size: 18px;
    text-transform: lowercase;
}

main {
    max-width: 760px;
    margin: 0 auto;
}

h1 {
    font-size: 42px;
    font-weight: 400;
    margin: 0 0 42px;
    text-transform: lowercase;
}

.search-wrap {
    margin-bottom: 54px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    color: #666;
}

input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #000;
    padding: 8px 0;
    font-family: inherit;
    font-size: 20px;
    outline: none;
}

#count {
    margin-top: 10px;
    font-size: 13px;
    color: #777;
}

details {
    margin-bottom: 22px;
}

summary {
    cursor: pointer;
    list-style: none;
}

summary::-webkit-details-marker {
    display: none;
}

.year > summary {
    font-size: 32px;
    margin-bottom: 26px;
}

.month > summary {
    font-size: 24px;
    margin: 20px 0;
}

.day {
    margin: 26px 0 38px 28px;
}

.day h3 {
    font-size: 17px;
    font-weight: 400;
    margin: 0 0 14px;
    color: #555;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.topic {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.topic a,
.topic .unlinked {
    color: #000;
    text-decoration: none;
    font-size: 19px;
}

.topic a:hover {
    font-style: italic;
}

.type {
    color: #777;
    font-size: 13px;
    white-space: nowrap;
    align-self: center;
}

mark {
    background: #f4f0c9;
    color: #000;
    padding: 0 2px;
}

.hidden {
    display: none;
}

@media (max-width: 600px) {
    body {
        padding: 28px 22px 70px;
    }

    header {
        margin-bottom: 70px;
    }

    h1 {
        font-size: 36px;
    }

    .topic {
        display: block;
        padding: 10px 0;
    }

    .type {
        display: block;
        margin-top: 4px;
    }
}
</style>
</head>

<body>

<header>
    <a href="/">robert rowland</a>
</header>

<main>
    <h1>archive</h1>

    <div class="search-wrap">
        <label for="search">search topics</label>
        <input id="search" type="search" autocomplete="off" placeholder="try: verdun, screenplay, gov, note">
        <div id="count"></div>
    </div>

    <section id="archive">

        <details class="year" open>
            <summary>2026</summary>

            <details class="month" open>
                <summary>July</summary>

                <section class="day" data-date="2026-07-10">
                    <h3></h3>

                    <ul>
                        <li class="topic" data-search="robertrowland.org website github pages personal archive notebook">
                            <span class="unlinked topic-title">robertrowland.org begins</span>
                            <span class="type">note</span>
                        </li>

                        <li class="topic" data-search="website as notebook archive structure writing notes unfinished ideas">
                            <span class="unlinked topic-title">website as working notebook</span>
                            <span class="type">note</span>
                        </li>

                        <li class="topic" data-search="screenplay draft fragments fiction seer future prediction">
                            <span class="unlinked topic-title">seer screenplay draft fragments</span>
                            <span class="type">screenplay</span>
                        </li>

                        <li class="topic" data-search="images video media screenshots maps reference visual archive">
                            <span class="unlinked topic-title">media archive concept</span>
                            <span class="type">media</span>
                        </li>
                    </ul>
                </section>

            </details>
        </details>

    </section>
</main>

<script>
const search = document.getElementById("search");
const count = document.getElementById("count");
const topics = Array.from(document.querySelectorAll(".topic"));
const days = Array.from(document.querySelectorAll(".day"));
const months = Array.from(document.querySelectorAll(".month"));
const years = Array.from(document.querySelectorAll(".year"));

function formatDayHeadings() {
    days.forEach(day => {
        const dateValue = day.dataset.date;
        const heading = day.querySelector("h3");

        if (!dateValue || !heading) return;

        const date = new Date(dateValue + "T12:00:00");

        const formatted = date.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        });

        heading.textContent = formatted;
    });
}

function escapeRegExp(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function escapeHTML(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function highlightText(text, query) {
    const safeText = escapeHTML(text);

    if (!query) {
        return safeText;
    }

    const pattern = new RegExp("(" + escapeRegExp(query) + ")", "ig");

    return safeText.replace(pattern, "<mark>$1</mark>");
}

function prepareTopicTitles() {
    topics.forEach(topic => {
        const title = topic.querySelector(".topic-title");
        if (!title) return;

        title.dataset.originalText = title.textContent;
    });
}

function updateSearch() {
    const query = search.value.trim().toLowerCase();
    let matches = 0;

    topics.forEach(topic => {
        const title = topic.querySelector(".topic-title");
        const originalTitle = title ? title.dataset.originalText : "";
        const searchableText = (
            topic.innerText + " " + topic.dataset.search
        ).toLowerCase();

        const isMatch = !query || searchableText.includes(query);

        topic.classList.toggle("hidden", !isMatch);

        if (title) {
            title.innerHTML = highlightText(originalTitle, query);
        }

        if (isMatch && query) {
            matches++;
        }
    });

    days.forEach(day => {
        const visibleTopics = day.querySelectorAll(".topic:not(.hidden)").length;
        day.classList.toggle("hidden", visibleTopics === 0);
    });

    months.forEach(month => {
        const visibleDays = month.querySelectorAll(".day:not(.hidden)").length;
        month.classList.toggle("hidden", visibleDays === 0);

        if (query && visibleDays > 0) {
            month.open = true;
        }
    });

    years.forEach(year => {
        const visibleMonths = year.querySelectorAll(".month:not(.hidden)").length;
        year.classList.toggle("hidden", visibleMonths === 0);

        if (query && visibleMonths > 0) {
            year.open = true;
        }
    });

    if (!query) {
        count.textContent = "";
    } else {
        count.textContent = matches === 1 ? "1 match" : matches + " matches";
    }
}

formatDayHeadings();
prepareTopicTitles();
search.addEventListener("input", updateSearch);
</script>

</body>
</html>
