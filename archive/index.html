<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Archive | Robert Rowland</title>

<style>
html, body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    padding: 42px 28px 90px;
}

header {
    margin-bottom: 90px;
}

header a {
    color: #000;
    text-decoration: none;
    font-size: 18px;
    text-transform: lowercase;
}

main {
    max-width: 760px;
    margin: 0 auto;
}

h1 {
    font-size: 42px;
    font-weight: 400;
    margin: 0 0 42px;
    text-transform: lowercase;
}

.search-wrap {
    margin-bottom: 54px;
}

label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    color: #666;
}

input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #000;
    padding: 8px 0;
    font-family: inherit;
    font-size: 20px;
    outline: none;
}

#count {
    margin-top: 10px;
    font-size: 13px;
    color: #777;
}

details {
    margin-bottom: 22px;
}

summary {
    cursor: pointer;
    list-style: none;
}

summary::-webkit-details-marker {
    display: none;
}

.year > summary {
    font-size: 32px;
    margin-bottom: 26px;
}

.month > summary {
    font-size: 24px;
    margin: 20px 0;
}

.day {
    margin: 26px 0 38px 28px;
}

.day h3 {
    font-size: 17px;
    font-weight: 400;
    margin: 0 0 14px;
    color: #555;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.topic {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

.topic a,
.topic .unlinked {
    color: #000;
    text-decoration: none;
    font-size: 19px;
}

.topic a {
    cursor: pointer;
}

.topic a:hover {
    font-style: italic;
    text-decoration: underline;
    text-underline-offset: 3px;
}

.type {
    color: #777;
    font-size: 13px;
    white-space: nowrap;
    align-self: center;
}

.tags {
    grid-column: 1 / -1;
    color: #999;
    font-size: 12px;
    line-height: 1.4;
    margin-top: -2px;
}

mark {
    background: #f4f0c9;
    color: #000;
    padding: 0 2px;
}

.hidden {
    display: none;
}

.empty {
    color: #777;
    font-size: 16px;
    margin-top: 40px;
}

@media (max-width: 600px) {
    body {
        padding: 28px 22px 70px;
    }

    header {
        margin-bottom: 70px;
    }

    h1 {
        font-size: 36px;
    }

    .topic {
        display: block;
        padding: 10px 0;
    }

    .type,
    .tags {
        display: block;
        margin-top: 4px;
    }
}
</style>
</head>

<body>

<header>
    <a href="/">robert rowland</a>
</header>

<main>
    <h1>archive</h1>

    <div class="search-wrap">
        <label for="search">search topics</label>
        <input id="search" type="search" autocomplete="off" placeholder="try: website, screenplay, biotech, note">
        <div id="count"></div>
    </div>

    <section id="archive"></section>
</main>

<script src="/data/notes.js"></script>

<script>
const archive = document.getElementById("archive");
const search = document.getElementById("search");
const count = document.getElementById("count");

const notes = Array.isArray(window.NOTES) ? window.NOTES : [];

function escapeHTML(text) {
    return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeRegExp(text) {
    return String(text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function highlightText(text, query) {
    const safeText = escapeHTML(text);

    if (!query) {
        return safeText;
    }

    const pattern = new RegExp("(" + escapeRegExp(query) + ")", "ig");
    return safeText.replace(pattern, "<mark>$1</mark>");
}

function parseDate(dateValue) {
    return new Date(dateValue + "T12:00:00");
}

function getYear(dateValue) {
    return parseDate(dateValue).getFullYear();
}

function getMonthName(dateValue) {
    return parseDate(dateValue).toLocaleDateString("en-US", {
        month: "long"
    });
}

function getFullDate(dateValue) {
    return parseDate(dateValue).toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    });
}

function getSearchText(note) {
    return [
        note.title,
        note.type,
        note.summary,
        note.sourceTitle,
        note.llmTool,
        ...(note.tags || [])
    ].join(" ").toLowerCase();
}

function groupNotes(filteredNotes) {
    const groups = {};

    filteredNotes.forEach(note => {
        const year = getYear(note.date);
        const month = getMonthName(note.date);
        const date = note.date;

        if (!groups[year]) groups[year] = {};
        if (!groups[year][month]) groups[year][month] = {};
        if (!groups[year][month][date]) groups[year][month][date] = [];

        groups[year][month][date].push(note);
    });

    return groups;
}

function renderArchive() {
    const query = search.value.trim().toLowerCase();

    const filteredNotes = notes
        .filter(note => {
            if (!query) return true;
            return getSearchText(note).includes(query);
        })
        .sort((a, b) => {
            return b.date.localeCompare(a.date) || a.title.localeCompare(b.title);
        });

    archive.innerHTML = "";

    if (filteredNotes.length === 0) {
        archive.innerHTML = '<div class="empty">no matches</div>';
        count.textContent = query ? "0 matches" : "";
        return;
    }

    const groups = groupNotes(filteredNotes);
    const years = Object.keys(groups).sort((a, b) => b - a);

    years.forEach(year => {
        const yearDetails = document.createElement("details");
        yearDetails.className = "year";
        yearDetails.open = true;

        const yearSummary = document.createElement("summary");
        yearSummary.textContent = year;
        yearDetails.appendChild(yearSummary);

        const months = Object.keys(groups[year]);

        months.forEach(month => {
            const monthDetails = document.createElement("details");
            monthDetails.className = "month";
            monthDetails.open = true;

            const monthSummary = document.createElement("summary");
            monthSummary.textContent = month;
            monthDetails.appendChild(monthSummary);

            const dates = Object.keys(groups[year][month]).sort((a, b) => b.localeCompare(a));

            dates.forEach(date => {
                const daySection = document.createElement("section");
                daySection.className = "day";

                const heading = document.createElement("h3");
                heading.textContent = getFullDate(date);
                daySection.appendChild(heading);

                const list = document.createElement("ul");

                groups[year][month][date].forEach(note => {
                    const item = document.createElement("li");
                    item.className = "topic";

                    const titleHTML = highlightText(note.title, query);

                    if (note.url) {
                        item.innerHTML = `
                            <a class="topic-title" href="${escapeHTML(note.url)}">${titleHTML}</a>
                            <span class="type">${escapeHTML(note.type)}</span>
                            <span class="tags">${escapeHTML((note.tags || []).join(" / "))}</span>
                        `;
                    } else {
                        item.innerHTML = `
                            <span class="unlinked topic-title">${titleHTML}</span>
                            <span class="type">${escapeHTML(note.type)}</span>
                            <span class="tags">${escapeHTML((note.tags || []).join(" / "))}</span>
                        `;
                    }

                    list.appendChild(item);
                });

                daySection.appendChild(list);
                monthDetails.appendChild(daySection);
            });

            yearDetails.appendChild(monthDetails);
        });

        archive.appendChild(yearDetails);
    });

    if (!query) {
        count.textContent = "";
    } else {
        count.textContent = filteredNotes.length === 1
            ? "1 match"
            : filteredNotes.length + " matches";
    }
}

search.addEventListener("input", renderArchive);
renderArchive();
</script>

</body>
</html>
