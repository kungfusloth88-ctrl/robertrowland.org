<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Archive | Robert Rowland</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #000;
    }

    body {
      padding: 42px 32px 80px;
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      margin-bottom: 18vh;
    }

    header a {
      color: #000;
      font-size: 18px;
      text-decoration: none;
      text-transform: lowercase;
    }

    main {
      width: min(620px, 100%);
      margin: 0 auto;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 34px;
    }

    nav a {
      color: #000;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 400;
      line-height: 1;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
      font-style: italic;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 22px 60px;
      }

      header {
        margin-bottom: 22vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="/">robert rowland</a>
  </header>

  <main>
    <nav aria-label="Archive sections">
      <a href="/writing/">writing</a>
      <a href="/screenplays/">screenplays</a>
      <a href="/media/">images / video</a>
    </nav>
  </main>
</body>
</html>
